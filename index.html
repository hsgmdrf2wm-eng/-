<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOGIC WORK | 論理的思考トレーニング</title><style>:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#17253b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:920px;margin:auto;padding:24px}.hero{background:linear-gradient(120deg,#16385f,#326b9a);color:white;border-radius:20px;padding:28px}h1{margin:0;font-size:30px}h2{font-size:22px}.muted{color:#64748b}.hero p{color:#e5edf8}.panel{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:22px;margin-top:18px;box-shadow:0 3px 15px #1e293b0a}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button{cursor:pointer;border:1px solid #cbd5e1;border-radius:10px;padding:11px 15px;background:white;color:#17365d;font-size:15px}button.primary,.nav button.active{background:#1d4d79;color:white;border-color:#1d4d79}button:disabled{opacity:.45;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.case{border:1px solid #d8e1eb;border-radius:12px;padding:16px}.case h3{margin:6px 0}.tag{font-size:12px;color:#285c87;background:#eaf3fa;border-radius:20px;padding:4px 9px;display:inline-block}.facts{background:#edf4fa;border-left:4px solid #3976a4;padding:16px;border-radius:8px;line-height:1.8}textarea{width:100%;min-height:130px;resize:vertical;padding:14px;font:inherit;border:1px solid #aab9c9;border-radius:10px}textarea:focus{outline:2px solid #5d91b8}.step{font-size:13px;color:#64748b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.hint{padding:15px;background:#f0f8f3;border-radius:10px;line-height:1.8}.feedback{background:#fff9e9;border-radius:10px;padding:15px;margin-top:12px;line-height:1.8}.progress{height:9px;background:#e5eaf0;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:#3d82ad}ul{line-height:1.9}footer{font-size:12px;color:#718096;margin:24px 0}.hidden{display:none}</style></head><body><div class="wrap"><header class="hero"><h1>LOGIC WORK</h1><p>考える力を、仕事の力に。社会人・事務職員のための論理的思考トレーニング</p></header><nav class="nav"><button data-view="home" class="active">ホーム</button><button data-view="practice">トレーニング</button><button data-view="records">学習記録</button><button data-view="about">使い方</button></nav><main id="app"></main><footer>学習データはこのブラウザー内に保存されます。個人情報や機密情報を入力しないでください。AI連携のないオフライン版です。</footer></div><script>
const cases=[
{cat:'事実と推測',title:'窓口対応への苦情が増えた',facts:'先月の苦情は4件、今月は7件。窓口利用者数は未集計。苦情の内容は対応時間に関するものが5件、案内内容に関するものが2件。',q:'「担当者の接客態度が悪化したため苦情が増えた」という意見をどう評価しますか？',checks:['苦情件数の増加と原因を区別できている','利用者数や苦情の内容など追加情報を挙げている','特定の担当者を根拠なく原因と決めつけていない'],guide:'苦情件数が増えたことは事実ですが、接客態度が原因かどうかは未確認です。利用者数、対応時間、苦情の具体的内容を調べましょう。'},
{cat:'原因分析',title:'申請書類の入力ミスが続く',facts:'1か月で入力ミスが6件。担当者は3名。入力手順書は2年前に作成。新しいシステムに切り替えたのは先月。',q:'考えられる原因を少なくとも3つ挙げ、確認方法も説明してください。',checks:['原因を複数挙げている','それぞれの原因を確認する方法を示している','担当者個人だけでなく仕組みにも着目している'],guide:'新システムの操作性、手順書の古さ、確認工程、業務量などの仮説が考えられます。発生箇所と作業ログを確認して切り分けます。'},
{cat:'優先順位',title:'3つの業務が重なった',facts:'A：本日17時締切の公的報告（所要90分）。B：来週締切の会議資料（所要3時間）。C：学生からの証明書申請（通常2営業日以内、所要15分）。現在14時。',q:'どの順序で対応しますか？ 判断基準も示してください。',checks:['期限と所要時間を比較している','遅延した場合の影響を考慮している','例外や確認すべき条件を挙げている'],guide:'公的報告の期限を最優先に考えつつ、証明書の実際の受付日や緊急性も確認します。優先順位は期限・影響度・所要時間で説明できます。'},
{cat:'解決策の比較',title:'共有メールの対応漏れ',facts:'共有メールで1か月に5件の対応漏れ。全員がメールを閲覧できるが、担当者の割り当てルールはない。',q:'改善策を2案以上出し、効果・負担・リスクを比較してください。',checks:['異なる改善案を2つ以上示している','効果と運用負担を比較している','実施後の検証方法を考えている'],guide:'担当者割当ルール、未処理一覧、受付時のステータス管理などが候補です。漏れ件数と確認工数を指標に試行・比較しましょう。'},
{cat:'根拠ある説明',title:'備品購入の必要性を説明する',facts:'現行機器は導入から8年。故障は昨年度1回、今年度3回。修理費は昨年度2万円、今年度8万円。新機器の見積りは28万円。',q:'購入を提案する場合、どの根拠を示し、何を追加確認しますか？',checks:['費用と故障状況を根拠として整理している','修理継続との比較を考えている','数字だけでは分からない業務への影響を確認している'],guide:'修理費の増加だけで購入を決めず、今後の修理見込み、停止による業務影響、保守費、耐用年数を比較します。'},
{cat:'因果関係',title:'広報活動と応募者数',facts:'今年は説明会を2回増やした。一方、応募者数は前年より減少した。対象年齢人口や他校の応募動向は未確認。',q:'「説明会を増やしても効果がなかった」と結論づけてよいでしょうか？',checks:['同時に起きたことと因果関係を区別している','説明会参加者の出願状況などを確認している','外部環境など別の要因を考えている'],guide:'応募者全体が減っても、説明会参加者の出願に一定の寄与があった可能性があります。参加者の出願率、比較対象、外部環境を確認しましょう。'}
];
const key='logicwork_v1';let records=[];try{records=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}let view='home',index=0,step=0,answers=[],checks=[],showHint=false;const app=document.querySelector('#app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(key,JSON.stringify(records))}catch(e){}}function navigate(v){view=v;render()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));function start(i){index=i;step=0;answers=[];checks=[];showHint=false;navigate('practice')}function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='home'){app.innerHTML=`<section class="panel"><h2>今日から、考える習慣を。</h2><p class="muted">1問5〜10分。職場の事例を読み、自分の考えを言語化し、根拠を確認します。</p><p>完了した演習：<strong>${records.length}回</strong></p><div class="cards">${cases.map((c,i)=>`<div class="case"><span class="tag">${esc(c.cat)}</span><h3>${esc(c.title)}</h3><button onclick="start(${i})">この問題に挑戦 →</button></div>`).join('')}</div></section>`}else if(view==='practice'){const c=cases[index];let html=`<section class="panel"><div class="step">問題 ${index+1} / ${cases.length} ・ ${esc(c.cat)}</div><h2>${esc(c.title)}</h2><div class="progress"><span style="width:${((step+1)/3)*100}%"></span></div><h3>確認されている事実</h3><div class="facts">${esc(c.facts)}</div>`;if(step===0){html+=`<h3>考えてみましょう</h3><p>${esc(c.q)}</p><textarea id="answer" placeholder="根拠と考えを、自分の言葉で書いてください。"></textarea><div class="actions"><button class="primary" onclick="submitAnswer()">回答して次へ</button><button onclick="toggleHint()">考えるヒント</button></div>${showHint?'<div class="hint">まず「確かめられた事実」「自分の推測」「追加で必要な情報」を分けて書いてみましょう。</div>':''}`;}else if(step===1){html+=`<h3>自分の考えを振り返る</h3><p>あなたの回答：</p><div class="facts">${esc(answers[0])}</div><p>当てはまる項目を選択してください。</p>${c.checks.map((x,i)=>`<p><label><input type="checkbox" id="check${i}" ${checks[i]?'checked':''} onchange="checks[${i}]=this.checked"> ${esc(x)}</label></p>`).join('')}<div class="actions"><button class="primary" onclick="finish()">振り返りを完了する</button><button onclick="step=0;render()">回答を修正する</button></div>`}else{const count=checks.filter(Boolean).length;html+=`<h3>演習完了</h3><p>自己チェック：<strong>${count} / 3</strong> 項目</p><div class="hint"><strong>解説・思考のポイント</strong><p>${esc(c.guide)}</p></div><div class="feedback">この評価は自己チェックです。AIが回答の正確性を自動判定したものではありません。チェックが少なかった観点を意識して、もう一度考えてみましょう。</div><div class="actions"><button class="primary" onclick="start(${(index+1)%cases.length})">次の問題へ →</button><button onclick="navigate('records')">学習記録を見る</button></div>`}app.innerHTML=html+'</section>';if(step===0&&answers[0])document.getElementById('answer').value=answers[0]}else if(view==='records'){app.innerHTML=`<section class="panel"><h2>学習記録</h2><p>完了した演習：<strong>${records.length}回</strong></p>${records.length?records.slice().reverse().map(r=>`<div class="case" style="margin-bottom:10px"><span class="tag">${esc(r.cat)}</span><h3>${esc(r.title)}</h3><p class="muted">${esc(r.date)} ・ 自己チェック ${r.score}/3</p><details><summary>回答を表示</summary><p style="white-space:pre-wrap">${esc(r.answer)}</p></details></div>`).join(''):'<p>まだ記録はありません。最初の演習を始めましょう。</p>'}<div class="actions"><button onclick="exportRecords()">記録をJSONで保存</button><button onclick="clearRecords()">記録を削除</button></div></section>`}else{app.innerHTML=`<section class="panel"><h2>使い方</h2><ol><li>ホームから職場の課題を選びます。</li><li>事実を読み、自分の考えと根拠を入力します。</li><li>3つの観点で自己チェックします。</li><li>解説を読み、次の演習に進みます。</li></ol><h3>考え方の基本</h3><p>①事実と推測を分ける → ②複数の仮説を立てる → ③根拠を確認する → ④選択肢を比較する → ⑤結論と理由を伝える。</p><p class="muted">この初期版はAI接続不要で動作します。実際の回答に応じたAIコーチング機能は、次の開発段階で追加できます。</p></section>`}}function submitAnswer(){const s=document.getElementById('answer').value.trim();if(s.length<15){alert('もう少し詳しく、15文字以上で考えを書いてください。');return}answers[0]=s;step=1;render()}function toggleHint(){showHint=!showHint;answers[0]=document.getElementById('answer').value;render()}function finish(){const c=cases[index];records.push({title:c.title,cat:c.cat,date:new Date().toLocaleString('ja-JP'),score:checks.filter(Boolean).length,answer:answers[0]});save();step=2;render()}function clearRecords(){if(confirm('保存済みの学習記録をすべて削除しますか？')){records=[];save();render()}}function exportRecords(){const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='logic_work_records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();
</script></body></html>
